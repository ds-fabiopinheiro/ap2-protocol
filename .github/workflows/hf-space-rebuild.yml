name: HF Space rebuild

# Reconstrói o Space da versão correspondente ao branch em que o código do
# backend mudou:
#   homolog-deploy -> ds-fabiopinheiro/ap2-homolog-backend (v2)
#   homolog-v3     -> ds-fabiopinheiro/ap2-homolog-v3
# Um push num branch reconstrói só o Space desse branch. Requer o secret
# HF_TOKEN (token fine-grained do Hugging Face com escrita nesses Spaces).

on:
  push:
    branches: [homolog-deploy, homolog-v3]
    paths:
      - "code/samples/python/**"
      - "code/sdk/**"
      - "deploy/hf-space/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-rebuild-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the Space of this branch
        id: space
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            homolog-deploy) space="ds-fabiopinheiro/ap2-homolog-backend" ;;
            homolog-v3)     space="ds-fabiopinheiro/ap2-homolog-v3" ;;
            *)
              echo "No Space is mapped to branch '$BRANCH'"
              exit 1
              ;;
          esac
          echo "Branch $BRANCH -> Space $space"
          echo "space=$space" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub
      - name: Factory rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ steps.space.outputs.space }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("HF_TOKEN secret is not set")
          runtime = HfApi(token=os.environ["HF_TOKEN"]).restart_space(
              os.environ["SPACE_ID"], factory_reboot=True
          )
          print(f"Space {os.environ['SPACE_ID']} stage: {runtime.stage}")
          EOF
