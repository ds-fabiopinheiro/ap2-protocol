# Reverse proxy do HF Space: expõe os 4 serviços do AP2 numa única porta (7860).
# Roda como usuário sem root (UID 1000 no HF Spaces), por isso todos os caminhos
# temporários ficam em /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  client_max_body_size 5m;

  # ---------------------------------------------------------------------------
  # Limite de requisições
  # ---------------------------------------------------------------------------
  # No HF Space o nginx recebe as conexões do proxy do Hugging Face, então
  # $remote_addr é um IP interno (10.x). O IP do visitante vem no
  # X-Forwarded-For; usamos o último endereço da lista, que é o adicionado
  # pelo proxy do HF (os anteriores podem ser enviados pelo próprio cliente).
  map $http_x_forwarded_for $client_ip {
    "~(?<last_ip>[^,\s]+)\s*$" $last_ip;
    default                    $remote_addr;
  }

  # Preflight CORS (OPTIONS) não conta: chave vazia = sem limite.
  map $request_method $limited_client_ip {
    OPTIONS "";
    default $client_ip;
  }
  map $request_method $limited_global_key {
    OPTIONS "";
    default "a2a";
  }

  # Agente (cada mensagem gera chamadas ao LLM): 20/min por visitante e
  # 120/min somando todos os visitantes, que limita o custo mesmo se alguém
  # falsificar o X-Forwarded-For.
  limit_req_zone $limited_client_ip  zone=a2a_per_ip:10m rate=20r/m;
  limit_req_zone $limited_global_key zone=a2a_global:1m  rate=120r/m;

  # Merchant: o web client consulta /merchant/state a cada 500 ms enquanto
  # monitora o preço (2/s por visitante).
  limit_req_zone $limited_client_ip  zone=merchant_per_ip:10m rate=5r/s;

  limit_req_status 429;
  limit_req_log_level warn;

  log_format proxied '$client_ip [$time_local] "$request" $status '
                     '$body_bytes_sent "$http_origin" xff="$http_x_forwarded_for"';

  server {
    access_log /dev/stdout proxied;

    # Resposta 429 em JSON e com CORS, para o navegador conseguir ler o erro.
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      add_header Access-Control-Allow-Origin * always;
      add_header Retry-After 60 always;
      return 429 '{"error":"rate_limited","message":"Muitas requisicoes. Aguarde um minuto e tente novamente."}';
    }

    listen 7860;

    # Status simples para checar se o container está no ar.
    location = / {
      default_type application/json;
      return 200 '{"service":"ap2-homolog-backend","routes":["/a2a/shopping_agent","/merchant"]}';
    }

    # Shopping Agent (ADK + A2A). Respostas em streaming (SSE): sem buffer.
    location /a2a/ {
      limit_req zone=a2a_per_ip burst=10 nodelay;
      limit_req zone=a2a_global burst=30 nodelay;
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
    }

    # Merchant: gatilho de price drop e /state usados pelo web client.
    location /merchant/ {
      limit_req zone=merchant_per_ip burst=20 nodelay;
      proxy_pass http://127.0.0.1:8081/;
    }

    # Credentials Provider (8082) e Merchant Payment Processor (8083) ficam
    # apenas na rede interna do container: só o Merchant e o Processor se
    # chamam entre si via localhost, o navegador não precisa deles.
  }
}
